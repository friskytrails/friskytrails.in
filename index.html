<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore India's most stunning destinations with FriskyTrails. We offer curated adventure tours, trekking, camping, and seasonal activities designed for every season. Book your next journey today!" />
    <meta name="keywords" content="FriskyTrails, adventure tours India, trekking India, camping activities, seasonal travel India, tour packages India" />
    <meta name="author" content="FriskyTrails" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.friskytrails.in/" />
    <meta property="og:title" content="FriskyTrails | Adventure Tours, Trekking & Seasonal Activities in India" />
    <meta property="og:description" content="Explore India's most stunning destinations with FriskyTrails. We offer curated adventure tours, trekking, camping, and seasonal activities." />
    <meta property="og:image" content="https://www.friskytrails.in/logo.webp" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.friskytrails.in/" />
    <meta property="twitter:title" content="FriskyTrails | Adventure Tours, Trekking & Activities" />
    <meta property="twitter:description" content="Discover stunning landscapes and thrill-seeking adventures with India's premier travel curators." />
    <meta property="twitter:image" content="https://www.friskytrails.in/logo.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.friskytrails.in" crossorigin>
    <link rel="dns-prefetch" href="https://api.friskytrails.in">
    
    <!-- Canonical link will be handled dynamically by React Helmet -->
    
    <link rel="preload" as="image" href="/logo.webp" fetchpriority="high">
    <link rel="preload" as="image" href="/images/video-poster.webp" fetchpriority="high">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sekuya+Static:wght@400;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Konkhmer+Sleokchher&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Sekuya+Static:wght@400;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Konkhmer+Sleokchher&display=swap" rel="stylesheet" media="print" onload="this.media='all'" crossorigin />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Sekuya+Static:wght@400;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Konkhmer+Sleokchher&display=swap" rel="stylesheet" />
    </noscript>

    <title>FriskyTrails | Adventure Tours, Trekking & Seasonal Activities in India</title>
    <script>
      // Dynamic Preload Hint for Destination Pages
      (function() {
        const path = window.location.pathname;
        if (path.includes('/state/') || path.includes('/city/')) {
          const slug = path.split('/').pop();
          // We can't know the exact image URL, but we can pre-connect to the asset domain
          const preconnect = document.createElement('link');
          preconnect.rel = 'preconnect';
          preconnect.href = 'https://api.friskytrails.in';
          document.head.appendChild(preconnect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
